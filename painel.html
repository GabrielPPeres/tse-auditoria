    { h: ra + ' 1º', n: 1, f: l => pct(l.pa1) }, { h: ra + ' 2º', n: 1, f: l => pct(l.pa2) }, { h: rb + ' 1º', n: 1, f: l => pct(l.pb1) }, { h: rb + ' 2º', n: 1, f: l => pct(l.pb2) },
    { h: 'Válidos 2º', n: 1, f: l => nf.format(l.val2) }], vir.slice().sort((a, b) => b.val2 - a.val2));

  // Conferência
  const cc = $('#card-conf');
  if (!conf || !conf.disponivel) { cc.style.display = 'none'; }
  else {
    cc.style.display = '';
    $('#kpis-conf').replaceChildren(
      kpi('Pares município × candidato comparados', nf.format(conf.pares_comparados), `${nf.format(conf.municipios_web)} municípios na totalização · ${nf.format(conf.municipios_csv)} no CSV`),
      kpi('Votos na totalização', nf.format(conf.votos_web), 'site de resultados do TSE'),
      kpi('Votos no CSV por seção', nf.format(conf.votos_csv), 'soma das seções'),
      kpi('Municípios com diferença', nf.format(conf.municipios_divergentes), conf.municipios_nao_explicados ? nf.format(conf.municipios_nao_explicados) + ' sem explicação automática' : 'todas explicadas (veja abaixo)'),
    );
    const anul = Object.entries(conf.votos_anulados_por_candidato || {});
    const expl = [];
    if (conf.votos_web === conf.votos_csv) expl.push('O total de votos é idêntico nas duas fontes.');
    anul.forEach(([n, v]) => expl.push(`Em ${nf.format(conf.municipios_explicados_nulo_tecnico)} municípios, a única diferença é que o CSV registra ${nf.format(v)} votos no número ${n}, e a totalização conta exatamente esses votos como nulos (o candidato ${n} não consta da lista de candidatos da totalização; votos de candidatura anulada viram "nulos técnicos").`));
    if (conf.municipios_so_totalizacao) expl.push(`${nf.format(conf.municipios_so_totalizacao)} municípios aparecem só na totalização, com ${nf.format(conf.votos_municipios_so_totalizacao)} votos (cidades do exterior sem eleitores votando).`);
    expl.push(conf.municipios_nao_explicados ? `${nf.format(conf.municipios_nao_explicados)} municípios têm diferenças de outro tipo: confira na lista.` : 'Nenhuma outra diferença foi encontrada.');
    let nota = $('#conf-expl');
    if (!nota) { nota = el('p', { class: 'q', id: 'conf-expl' }); $('#kpis-conf').after(nota); }
    nota.textContent = expl.join(' ');
    tabela('conf', [{ h: 'UF', k: 'uf' }, { h: 'Município', k: 'municipio' }, { h: 'Nº votável', k: 'votavel' }, { h: 'Totalização', n: 1, f: l => nf.format(l.totalizacao) }, { h: 'CSV por seção', n: 1, f: l => nf.format(l.csv_secao) }, { h: 'Diferença', n: 1, f: l => nf.format(l.diferenca) }], conf.lista);
  }
}

// ================================================================= Biometria e horário (logs das urnas)
async function rUrnas(sec, vivo) {
  cache.delete('/api/logs/meta');
  const meta = await api('/api/logs/meta');
  const prontos = t => (meta.fontes || []).filter(f => String(f.turno) === t);
  const pT = prontos(S.turno), outro = S.turno === '1' ? '2' : '1', pO = prontos(outro);
  if (!pT.length) {
    sec.dataset.chave = '';
    sec.replaceChildren(el('div', { class: 'banner' }, el('b', { text: `Os logs das urnas do ${S.turno}º turno ainda não foram lidos.` }), el('br'),
      document.createTextNode(S.turno === '2' ? 'A leitura do 2º turno está em andamento (cerca de 500 mil urnas). Volte em alguns minutos; as UFs aparecem à medida que ficam prontas.'
        : 'O 1º turno exige baixar cerca de 95 GB do TSE (processados e apagados UF por UF). Rode "py -3 main.py logs --turno 1".'),
      pO.length ? el('br') : null, pO.length ? document.createTextNode(`Já existem logs do ${outro}º turno: troque o turno no botão acima.`) : null));
    return;
  }
  const uf = S.uf && S.uf !== 'ZZ' ? S.uf : '';
  const pres = await api('/api/resumo', { turno: S.turno, cargo: '1' });
  const pa = S.cargo === '1' ? S.a : pres.itens[0].partido;
  const v = pT.length, vO = pO.length;   // muda quando novas UFs ficam prontas (evita resposta antiga do cache)
  const [r, rO, mi, miO, secs, mun] = await Promise.all([
    api('/api/logs/resumo', { turno: S.turno, uf, v }), pO.length ? api('/api/logs/resumo', { turno: outro, uf, v: vO }) : null,
    api('/api/logs/minuto', { turno: S.turno, uf, v }), pO.length ? api('/api/logs/minuto', { turno: outro, uf, v: vO }) : null,
    api('/api/logs/secoes', { turno: S.turno, uf, v }), api('/api/municipios', { turno: S.turno, cargo: '1', a: pa, b: pa }), geo()]);
  if (!vivo()) return;
  const t = tokens(), T = r.totais, ra = (() => { const it = pres.itens.find(i => i.partido === pa); return it ? curto(it.nome) + ' (' + sigla(pa) + ')' : sigla(pa); })();
  const parcial = pT.length < 28 ? ` Leitura em andamento: ${pT.length} de 28 UFs (incluindo exterior) prontas.` : '';

  montar(sec, 'urnas', () => [el('div', { class: 'grid' },
    el('div', { class: 'banner', id: 'ur-nota', style: 'grid-column:span 12;margin:0' }),
    el('div', { class: 'kpis', id: 'kpis-u' }),
    card('umin', 'Votos por minuto', '', { w: 12 }),
    card('ubio', 'Com e sem biometria, hora a hora', '', { w: 6 }),
    card('uufb', 'Votos sem biometria em cada UF', '', { w: 6, cls: 'xtall' }),
    card('umap', '', '', { w: 12, cls: 'xtall', nota: 'Cada área é um município (malha do IBGE). Arraste para mover e use a roda do mouse para aproximar.' }),
    card('udur', 'Tempo na cabine', 'Tempo entre o eleitor ser habilitado e o voto ser computado, em faixas de 10 segundos.', { w: 6 }),
    card('utent', 'Tentativas até a digital ser reconhecida', 'Eleitores habilitados por biometria, pelo número da tentativa em que a digital foi aceita.', { w: 6 }),
    card('ucorr', '', '', { w: 12, cls: 'tall' }),
    (() => el('div', { class: 'card w12' }, el('h2', { text: 'Seções com maior % de eleitores sem biometria' }), el('p', { class: 'q', text: 'Seções com pelo menos 30 votos. Habilitação sem biometria é prevista em lei (por exemplo, digital não reconhecida ou eleitor sem digital cadastrada); a lista serve para conferência.' }), el('div', { class: 'tablewrap', id: 'tb-usb', style: 'max-height:420px' })))(),
    (() => el('div', { class: 'card w12' }, el('h2', { id: 'uap-h', text: 'Seções com votos depois das 17h (horário de Brasília)' }), el('p', { class: 'q', id: 'uap-q' }), el('div', { class: 'tablewrap', id: 'tb-uap', style: 'max-height:420px' })))(),
    (() => el('div', { class: 'card w12' }, el('h2', { text: 'Conferência: votos nos logs × total oficial, por município' }), el('p', { class: 'q', id: 'udf-q' }), el('div', { class: 'tablewrap', id: 'tb-udf', style: 'max-height:420px' })))(),
  )]);
  $('#ur-nota').textContent = `Fonte: log de cada urna eletrônica (${S.turno === '2' ? 'arquivos por urna em resultados.tse.jus.br' : 'arquivos transmitidos para totalização, portal de dados abertos do TSE'}). Horários convertidos para o horário de Brasília. O log registra quando cada eleitor votou e como foi habilitado, mas não registra em quem votou.${parcial}${uf ? ' UF: ' + NOME_UF(uf) + '.' : ''}`;

  const conf = r.conferencia, dif = conf.votos_log - conf.votos_oficial;
  $('#kpis-u').replaceChildren(
    kpi('Votos registrados nos logs', nf.format(T.votos), `${nf.format(T.urnas)} urnas · ${S.turno}º turno`, true),
    kpi('Com biometria', pct(100 * T.bio / T.votos), nf.format(T.bio) + ' eleitores'),
    kpi('Sem biometria', pct(100 * T.sem_bio / T.votos), nf.format(T.sem_bio) + ' eleitores'),
    kpi('Votos depois das 17h', nf.format(T.apos_fechamento), `${nf.format(secs.secoes_com_voto_apos)} seções · eleitores que estavam na fila`),
    kpi('Tempo médio na cabine', T.dur_n ? nf.format(Math.round(T.dur_soma / T.dur_n)) + ' s' : '–', pct(100 * T.tent_mais1 / Math.max(T.bio, 1)) + ' precisaram de mais de 1 tentativa de digital'),
    kpi('Log × total oficial', (dif === 0 ? 'igual' : (dif > 0 ? '+' : '') + nf.format(dif)), `${nf.format(conf.votos_log)} no log · ${nf.format(conf.votos_oficial)} no total oficial de Presidente · ${nf.format(conf.municipios_diferentes)} municípios com diferença`),
  );

  // Votos por minuto, os dois turnos
  const serieMin = (d, nome, c, w) => ({ name: nome, type: 'line', showSymbol: false, data: d.minutos.filter(m => m.min >= '07:30' && m.min <= '18:30').map(m => [m.min, m.votos]), lineStyle: { width: w, color: c }, itemStyle: { color: c }, areaStyle: w > 1.5 ? { color: c, opacity: .08 } : undefined });
  const minutos = [...new Set([...mi.minutos.map(m => m.min), ...(miO ? miO.minutos.map(m => m.min) : [])])].filter(m => m >= '07:30' && m <= '18:30').sort();
  $('#card-umin .q').textContent = `Quantos votos foram computados em cada minuto, somando todas as urnas${uf ? ' de ' + NOME_UF(uf) : ' do país'} (horário de Brasília). A votação vai das 8h às 17h; depois das 17h votam só os eleitores que já estavam na fila.`;
  chart('ch-umin').setOption(base(t, {
    grid: { left: 60, right: 20, top: 36, bottom: 40 },
    legend: { top: 0, left: 0, textStyle: { color: t.ink2 } },
    tooltip: { ...base(t).tooltip, trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: t.axis } }, formatter: ps => `<div>${esc(ps[0].axisValue)}</div>` + ps.map(p => linhaTip(p.color, nf.format(p.value[1]), p.seriesName)).join('') },
    xAxis: eixo(t, { type: 'category', data: minutos, boundaryGap: false, splitLine: { show: false }, axisLabel: { color: t.muted, interval: 59 } }),
    yAxis: eixo(t, { type: 'value', axisLabel: { color: t.muted, formatter: v => nfc.format(v) } }),
    series: [serieMin(mi, S.turno + 'º turno', t.series[0], 2), ...(miO ? [serieMin(miO, outro + 'º turno', t.other, 1.5)] : [])],
  }), true);
  tabela('umin', [{ h: 'Minuto', k: 'min' }, { h: 'Votos', n: 1, f: l => nf.format(l.votos) }, { h: 'Com biometria', n: 1, f: l => nf.format(l.bio) }], mi.minutos);

  // Por hora: com e sem biometria (empilhado)
  const horas = {};
  mi.minutos.forEach(m => { const h = m.min.slice(0, 2); const x = horas[h] = horas[h] || { bio: 0, sem: 0 }; x.bio += m.bio; x.sem += m.votos - m.bio; });
  const H = Object.keys(horas).filter(h => h >= '08' && h <= '18').sort();
  $('#card-ubio .q').textContent = 'Votos computados em cada hora (Brasília), separando eleitores habilitados pela digital e sem biometria.';
  chart('ch-ubio').setOption(base(t, {
    grid: { left: 60, right: 20, top: 36, bottom: 40 },
    legend: { top: 0, left: 0, textStyle: { color: t.ink2 }, itemWidth: 10, itemHeight: 10 },
    tooltip: { ...base(t).tooltip, trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: ps => `<div>${esc(ps[0].axisValue)}h</div>` + ps.map(p => linhaTip(p.color, nf.format(p.value), p.seriesName)).join('') + `<div>Sem biometria: <b>${pct(100 * horas[ps[0].axisValue].sem / (horas[ps[0].axisValue].sem + horas[ps[0].axisValue].bio))}</b></div>` },
    xAxis: eixo(t, { type: 'category', data: H, splitLine: { show: false }, axisLabel: { color: t.muted, formatter: '{value}h' } }),
    yAxis: eixo(t, { type: 'value', axisLabel: { color: t.muted, formatter: v => nfc.format(v) } }),
    series: [{ name: 'Com biometria', type: 'bar', stack: 'h', barMaxWidth: 24, data: H.map(h => horas[h].bio), itemStyle: { color: t.series[0], borderColor: t.surface, borderWidth: 1 } },
      { name: 'Sem biometria', type: 'bar', stack: 'h', barMaxWidth: 24, data: H.map(h => horas[h].sem), itemStyle: { color: t.series[1], borderRadius: [4, 4, 0, 0], borderColor: t.surface, borderWidth: 1 } }],
  }), true);
  tabela('ubio', [{ h: 'Hora', f: l => l + 'h' }, { h: 'Com biometria', n: 1, f: l => nf.format(horas[l].bio) }, { h: 'Sem biometria', n: 1, f: l => nf.format(horas[l].sem) }, { h: '% sem', n: 1, f: l => pct(100 * horas[l].sem / (horas[l].sem + horas[l].bio)) }], H);

  // Por UF: % sem biometria, nos dois turnos
  const porUF = res => { const o = {}; (res ? res.municipios : []).forEach(m => { const x = o[m.uf] = o[m.uf] || { v: 0, s: 0 }; x.v += m.votos; x.s += m.sem_bio; }); return o; };
  const uA = porUF(r), uB = porUF(rO);
  const ufsU = Object.keys(uA).filter(u => u !== 'ZZ').sort((x, y) => uA[x].s / uA[x].v - uA[y].s / uA[y].v);
  $('#card-uufb .q').textContent = `% dos eleitores habilitados sem biometria em cada UF${rO ? ', no ' + S.turno + 'º e no ' + outro + 'º turno' : ''}.`;
  chart('ch-uufb').setOption(base(t, {
    grid: { left: 50, right: 30, top: 34, bottom: 30 },
    legend: { top: 0, left: 0, textStyle: { color: t.ink2 }, itemWidth: 10, itemHeight: 10 },
    tooltip: { ...base(t).tooltip, trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: ps => `<div>${esc(ps[0].axisValue)}</div>` + ps.map(p => linhaTip(p.color, pct(p.value), p.seriesName)).join('') },
    xAxis: eixo(t, { type: 'value', axisLabel: { color: t.muted, formatter: '{value}%' } }),
    yAxis: eixo(t, { type: 'category', data: ufsU, splitLine: { show: false }, axisLabel: { color: t.ink2 } }),
    series: [{ name: S.turno + 'º turno', type: 'bar', barMaxWidth: 10, data: ufsU.map(u => +(100 * uA[u].s / uA[u].v).toFixed(2)), itemStyle: { color: t.series[0], borderRadius: [0, 4, 4, 0] } },
      ...(rO ? [{ name: outro + 'º turno', type: 'bar', barMaxWidth: 10, data: ufsU.map(u => uB[u] ? +(100 * uB[u].s / uB[u].v).toFixed(2) : null), itemStyle: { color: t.other, borderRadius: [0, 4, 4, 0] } }] : [])],
  }), true);
  tabela('uufb', [{ h: 'UF', f: l => l }, { h: S.turno + 'º turno', n: 1, f: l => pct(100 * uA[l].s / uA[l].v) }, ...(rO ? [{ h: outro + 'º turno', n: 1, f: l => uB[l] ? pct(100 * uB[l].s / uB[l].v) : '–' }] : [])], ufsU.slice().reverse());

  // Mapa real: % sem biometria por município
  const nomesMun = Object.fromEntries(mun.map(m => [m.uf + '|' + m.mun, m.municipio]));
  const UM = r.municipios.filter(m => m.uf !== 'ZZ' && m.votos > 0).map(m => ({ ...m, p: 100 * m.sem_bio / m.votos, cd: ibge(m.uf, m.mun), nome: nomesMun[m.uf + '|' + m.mun] || m.mun })).filter(m => m.cd);
  const umMax = Math.ceil(quantis(UM.map(m => m.p))[3] * 2 / 5) * 5 || 10;
  $('#card-umap h2').textContent = `Eleitores sem biometria por município · ${S.turno}º turno`;
  $('#card-umap .q').textContent = `% dos eleitores de cada município habilitados sem a digital. A escala vai até ${umMax}%; municípios acima disso aparecem com a cor mais forte.`;
  chart('ch-umap').setOption(optMapa(t, { mapa: mapaMun(uf), tipo: 'seq', min: 0, max: umMax, txtMax: umMax + '% ou mais', txtMin: '0%', borda: uf ? .5 : .1,
    dados: UM.map(m => ({ name: m.cd, value: +Math.min(m.p, umMax).toFixed(2), m })),
    tip: x => `<div>${esc(x.m.nome)} (${esc(x.m.uf)})</div><b>${pct(x.m.p)}</b> sem biometria<div style="opacity:.75">${nf.format(x.m.sem_bio)} de ${nf.format(x.m.votos)} eleitores · ${nf.format(x.m.urnas)} urnas</div>` }), true);
  tabela('umap', [{ h: 'Município', k: 'nome' }, { h: 'UF', k: 'uf' }, { h: '% sem biometria', n: 1, f: l => pct(l.p) }, { h: 'Sem biometria', n: 1, f: l => nf.format(l.sem_bio) }, { h: 'Eleitores', n: 1, f: l => nf.format(l.votos) }], UM.slice().sort((x, y) => y.p - x.p).slice(0, 1000));

  // Tempo na cabine (histograma)
  const dur = Array.from({ length: 61 }, (_, i) => r.duracao[i] || 0);
  chart('ch-udur').setOption(base(t, {
    grid: { left: 60, right: 20, top: 20, bottom: 40 },
    tooltip: { ...base(t).tooltip, trigger: 'item', formatter: p => `<div>${p.dataIndex === 60 ? '10 min ou mais' : p.dataIndex * 10 + '–' + (p.dataIndex * 10 + 10) + ' s'}</div><b>${nf.format(p.value)}</b> eleitores` },
    xAxis: eixo(t, { type: 'category', data: dur.map((_, i) => i === 60 ? '600+' : String(i * 10)), splitLine: { show: false }, axisLabel: { color: t.muted, interval: 5, formatter: v => v + ' s' } }),
    yAxis: eixo(t, { type: 'value', axisLabel: { color: t.muted, formatter: v => nfc.format(v) } }),
    series: [{ type: 'bar', barCategoryGap: '8%', data: dur, itemStyle: { color: t.series[0], borderRadius: [3, 3, 0, 0] } }],
  }), true);
  tabela('udur', [{ h: 'Faixa', f: l => l.i === 60 ? '600 s ou mais' : l.i * 10 + '–' + (l.i * 10 + 10) + ' s' }, { h: 'Eleitores', n: 1, f: l => nf.format(l.v) }], dur.map((v, i) => ({ i, v })));

  // Tentativas de digital
  const tent = [1, 2, 3, 4].map(k => r.tentativas[k] || 0), tt = tent.reduce((a, b) => a + b, 0) || 1;
  chart('ch-utent').setOption(base(t, {
    grid: { left: 60, right: 20, top: 20, bottom: 40 },
    tooltip: { ...base(t).tooltip, trigger: 'item', formatter: p => `<div>${p.name}</div><b>${nf.format(p.value)}</b> eleitores (${pct(100 * p.value / tt)})` },
    xAxis: eixo(t, { type: 'category', data: ['1ª tentativa', '2ª', '3ª', '4ª'], splitLine: { show: false }, axisLabel: { color: t.ink2 } }),
    yAxis: eixo(t, { type: 'value', axisLabel: { color: t.muted, formatter: v => nfc.format(v) } }),
    series: [{ type: 'bar', barMaxWidth: 48, data: tent, itemStyle: { color: t.series[0], borderRadius: [4, 4, 0, 0] }, label: { show: true, position: 'top', color: t.ink2, fontSize: 11, formatter: p => pct(100 * p.value / tt) } }],
  }), true);
  tabela('utent', [{ h: 'Tentativa', f: l => l.k + 'ª' }, { h: 'Eleitores', n: 1, f: l => nf.format(l.v) }, { h: '%', n: 1, f: l => pct(100 * l.v / tt) }], tent.map((v, i) => ({ k: i + 1, v })));

  // Relação: % sem biometria × % de A, por município
  const pA = Object.fromEntries(mun.map(m => [m.uf + '|' + m.mun, 100 * m.a / m.validos]));
  const CR = UM.filter(m => (m.uf + '|' + m.mun) in pA && m.votos >= 200).map(m => ({ ...m, a: pA[m.uf + '|' + m.mun] }));
  $('#card-ucorr h2').textContent = `Sem biometria × votação de ${ra}, por município`;
  $('#card-ucorr .q').textContent = `Cada ponto é um município com pelo menos 200 eleitores. Horizontal: % sem biometria. Vertical: % dos válidos de ${ra} para presidente no ${S.turno}º turno. Um padrão aqui mostra relação entre regiões, não prova sobre votos individuais (o log não registra em quem cada eleitor votou).`;
  chart('ch-ucorr').setOption(base(t, {
    grid: { left: 50, right: 20, top: 20, bottom: 40 },
    tooltip: { ...base(t).tooltip, trigger: 'item', formatter: p => `<div>${esc(p.name)}</div><div>Sem biometria: <b>${pct(p.value[0])}</b></div><div>${esc(ra)}: <b>${pct(p.value[1])}</b></div>` },
    xAxis: eixo(t, { type: 'value', min: 0, name: '% sem biometria', nameLocation: 'middle', nameGap: 26, axisLabel: { color: t.muted, formatter: '{value}%' } }),
    yAxis: eixo(t, { type: 'value', min: 0, max: 100, name: '% ' + ra, nameLocation: 'middle', nameGap: 36, axisLabel: { color: t.muted, formatter: '{value}%' } }),
    series: [{ type: 'scatter', progressive: 0, symbolSize: 5, data: CR.map(m => ({ value: [+m.p.toFixed(2), +m.a.toFixed(2)], name: m.nome + ' (' + m.uf + ')', itemStyle: { color: t.series[0], opacity: .45 } })) }],
  }), true);
  tabela('ucorr', [{ h: 'Município', k: 'nome' }, { h: 'UF', k: 'uf' }, { h: '% sem biometria', n: 1, f: l => pct(l.p) }, { h: '% ' + ra, n: 1, f: l => pct(l.a) }], CR.slice().sort((x, y) => y.p - x.p).slice(0, 1000));

  // Tabelas de seções
  const colSec = [{ h: 'UF', k: 'uf' }, { h: 'Município', k: 'municipio' }, { h: 'Zona', k: 'zona' }, { h: 'Seção', k: 'secao' }, { h: 'Votos', n: 1, f: l => nf.format(l.votos) }];
  tabela('usb', [...colSec, { h: 'Sem biometria', n: 1, f: l => nf.format(l.sem_bio) }, { h: '%', n: 1, f: l => pct(l.pct_sem_bio) }], secs.sem_biometria);
  $('#uap-q').textContent = `${nf.format(secs.secoes_com_voto_apos)} seções tiveram votos depois das 17h (horário de Brasília). É permitido: quem está na fila às 17h vota. Lista das 100 com mais votos após o horário.`;
  tabela('uap', [...colSec, { h: 'Depois das 17h', n: 1, f: l => nf.format(l.apos) }, { h: 'Último voto (Brasília)', f: l => l.ultimo_brasilia || '–' }], secs.apos_fechamento);

  // Conferência por município
  const DF = r.municipios.filter(m => m.oficial != null && m.oficial !== m.votos).map(m => ({ ...m, d: m.votos - m.oficial, nome: nomesMun[m.uf + '|' + m.mun] || m.mun })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  $('#udf-q').textContent = `Total oficial de Presidente (comparecimento) comparado com os votos computados nos logs das urnas. ${nf.format(DF.length)} municípios diferem; no total, ${nf.format(Math.abs(dif))} votos (${pct(100 * Math.abs(dif) / Math.max(conf.votos_oficial, 1))}). Seções agregadas não têm log próprio (seus eleitores votam em outra urna) e não causam diferença. Causas possíveis para o restante: urna substituída durante o dia ou votação em cédula de papel, que não ficam no log eletrônico da seção. Confira os casos no boletim de urna.`;
  tabela('udf', [{ h: 'UF', k: 'uf' }, { h: 'Município', k: 'nome' }, { h: 'Votos no log', n: 1, f: l => nf.format(l.votos) }, { h: 'Total oficial', n: 1, f: l => nf.format(l.oficial) }, { h: 'Diferença', n: 1, f: l => nf.format(l.d) }, { h: 'Urnas lidas', n: 1, f: l => nf.format(l.urnas) }], DF.slice(0, 500));
}

// ================================================================= SQL livre
async function rSql(sec) {
  montar(sec, 'sql', () => {
    const ta = el('textarea', { id: 'sql-q', spellcheck: 'false', 'aria-label': 'Consulta SQL' });
    ta.value = "SELECT uf, SUM(votos) AS votos\nFROM ag_mun\nWHERE turno = 1 AND cargo = '1' AND partido = '22'\nGROUP BY uf ORDER BY votos DESC";
    const bt = el('button', { class: 'btn primary', type: 'button', text: 'Executar' });
    const out = el('div', { id: 'sql-out' });
    bt.addEventListener('click', async () => {
      out.replaceChildren(el('p', { class: 'note', text: 'Consultando...' }));
      try {
        const r = await fetch('/api/sql', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: ta.value }) }).then(x => x.json());
        if (r.erro) throw new Error(r.erro);
        const box = el('div', { class: 'card w12', style: 'margin-top:16px' }, el('h2', { text: r.linhas.length + ' linhas (máximo 1.000)' }));
        const numerico = r.colunas.length === 2 && r.linhas.length && r.linhas.every(l => typeof l[1] === 'number');
        if (numerico) box.append(el('div', { class: 'chart', id: 'ch-sqlc', role: 'img', 'aria-label': 'Resultado em barras' }));
        box.append(el('div', { class: 'tablewrap', id: 'tb-sqlt', style: 'max-height:480px' }));
        out.replaceChildren(box);
        tabela('sqlt', r.colunas.map((c, i) => ({ h: c, n: typeof (r.linhas[0] || [])[i] === 'number', f: l => typeof l[i] === 'number' ? nf.format(l[i]) : (l[i] ?? '') })), r.linhas);
        if (numerico) {
          const t = tokens(), L = r.linhas.slice(0, 40);
          chart('ch-sqlc').setOption(base(t, {
            grid: { left: 60, right: 20, top: 20, bottom: 60 },
            tooltip: { ...base(t).tooltip, trigger: 'item', formatter: p => `<div>${esc(p.name)}</div><b>${nf.format(p.value)}</b>` },
            xAxis: eixo(t, { type: 'category', data: L.map(l => String(l[0])), splitLine: { show: false }, axisLabel: { color: t.ink2, rotate: 30 } }),
            yAxis: eixo(t, { type: 'value', axisLabel: { color: t.muted, formatter: v => nfc.format(v) } }),
            series: [{ type: 'bar', barMaxWidth: 24, data: L.map(l => l[1]), itemStyle: { color: t.series[0], borderRadius: [4, 4, 0, 0] } }],
          }), true);
        }
      } catch (e) { out.replaceChildren(el('p', { class: 'err', text: e.message })); }
    });
    const ajuda = el('div', { class: 'card w12' }, el('h2', { text: 'Consulta livre (somente leitura)' }),
      el('p', { class: 'q', text: 'Tabelas: votos (bruta, 68 milhões de linhas, lenta), ag_mun, ag_mun_tot, ag_cand, ag_secao, ag_secao_tot, ag_partidos. Se o resultado tiver 2 colunas e a segunda for numérica, aparece um gráfico de barras.' }),
      ta, el('div', { style: 'margin-top:8px' }, bt), out);
    return [el('div', { class: 'grid' }, ajuda)];
  });
}

iniciar().catch(e => $('#main').replaceChildren(el('div', { class: 'banner err', text: 'Erro ao iniciar: ' + e.message })));
</script>
